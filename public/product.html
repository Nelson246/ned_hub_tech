<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Product</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
>

<style>

:root {
    --primary: #0080ff;
    --secondary: #00aaff;
    --accent: #ffd700;
    --dark: #111827;
    --gray: #6b7280;
    --light: #f5f7fa;
    --white: #ffffff;
    --danger: #dc3545;
    --success: #16833f;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "DM Sans", Arial, sans-serif;
    background: var(--light);
    color: var(--dark);
    min-height: 100vh;
}

a {
    text-decoration: none;
    color: inherit;
}


/* ================================
   HEADER
================================ */

header {
    background: var(--header-color, var(--primary));
    color: white;
    padding: 15px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-family: "Playfair Display", serif;
    font-size: 28px;
    font-weight: 700;
    white-space: nowrap;
}

.search-box {
    flex: 1;
    max-width: 600px;
}

.search-box form {
    display: flex;
    width: 100%;
}

.search-box input {
    flex: 1;
    padding: 12px 15px;
    border: none;
    outline: none;
    border-radius: 8px 0 0 8px;
    font-size: 15px;
}

.search-box button {
    padding: 12px 18px;
    border: none;
    background: var(--accent);
    color: #111;
    cursor: pointer;
    border-radius: 0 8px 8px 0;
    font-weight: 700;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-actions a {
    color: white;
    font-weight: 600;
    white-space: nowrap;
}

.cart-link {
    position: relative;
}

.cart-count {
    position: absolute;
    top: -10px;
    right: -12px;
    min-width: 20px;
    height: 20px;
    background: var(--accent);
    color: #111;
    border-radius: 50%;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
}


/* ================================
   BREADCRUMB
================================ */

.breadcrumb {
    padding: 18px 5%;
    color: var(--gray);
    font-size: 14px;
}

.breadcrumb a {
    color: var(--primary);
    font-weight: 600;
}


/* ================================
   LOADING
================================ */

.loading {
    min-height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--gray);
}

.spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #ddd;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* ================================
   PRODUCT
================================ */

.product-container {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto 50px;
}

.product-card {
    background: var(--white);
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 45px;
}


/* ================================
   IMAGE AREA
================================ */

.image-section {
    width: 100%;
}

.main-image-wrapper {
    position: relative;
    width: 100%;
    height: 500px;
    background: #f3f4f6;
    border-radius: 15px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

#mainProductImage {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.image-placeholder {
    color: var(--gray);
    text-align: center;
    padding: 30px;
}

.image-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: white;
    font-size: 30px;
    cursor: pointer;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
}

.image-arrow:hover {
    background: rgba(0, 0, 0, 0.75);
}

.image-arrow.left {
    left: 15px;
}

.image-arrow.right {
    right: 15px;
}

.image-counter {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.65);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
}

.thumbnail-container {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.thumbnail {
    width: 75px;
    height: 75px;
    flex: 0 0 75px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    background: #f3f4f6;
}

.thumbnail:hover {
    border-color: var(--primary);
}

.thumbnail.active {
    border-color: var(--primary);
}


/* ================================
   PRODUCT INFO
================================ */

.product-info {
    display: flex;
    flex-direction: column;
}

.product-category {
    color: var(--primary);
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 10px;
}

.product-name {
    font-family: "Playfair Display", serif;
    font-size: 38px;
    line-height: 1.2;
    margin-bottom: 10px;
}

.product-sku {
    color: var(--gray);
    font-size: 14px;
    margin-bottom: 20px;
}

.product-price {
    font-size: 30px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 18px;
}

.stock-badge {
    display: inline-block;
    width: fit-content;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 22px;
}

.stock-badge.in-stock {
    background: #dcfce7;
    color: var(--success);
}

.stock-badge.out-stock {
    background: #fee2e2;
    color: var(--danger);
}

.product-description {
    color: #4b5563;
    line-height: 1.8;
    margin-bottom: 25px;
    white-space: pre-line;
}


/* ================================
   QUANTITY
================================ */

.quantity-title {
    font-weight: 700;
    margin-bottom: 10px;
}

.quantity-controls {
    display: flex;
    align-items: center;
    margin-bottom: 25px;
}

.quantity-controls button {
    width: 42px;
    height: 42px;
    border: 1px solid #ddd;
    background: #f9fafb;
    font-size: 22px;
    cursor: pointer;
}

.quantity-controls button:first-child {
    border-radius: 8px 0 0 8px;
}

.quantity-controls button:last-child {
    border-radius: 0 8px 8px 0;
}

.quantity-controls button:hover {
    background: #e5e7eb;
}

.quantity-controls input {
    width: 65px;
    height: 42px;
    text-align: center;
    border: 1px solid #ddd;
    border-left: none;
    border-right: none;
    outline: none;
    font-size: 16px;
}


/* ================================
   BUTTONS
================================ */

.action-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.action-btn {
    flex: 1;
    min-width: 180px;
    padding: 14px 20px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.add-cart {
    background: var(--primary);
    color: white;
}

.buy-now {
    background: var(--accent);
    color: #111;
}

.action-btn:hover {
    transform: translateY(-2px);
    opacity: 0.92;
}

.action-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
    transform: none;
}


/* ================================
   MESSAGE
================================ */

.message {
    margin-top: 18px;
    padding: 12px 15px;
    border-radius: 8px;
    display: none;
    font-weight: 600;
}

.message.success {
    display: block;
    background: #dcfce7;
    color: var(--success);
}

.message.error {
    display: block;
    background: #fee2e2;
    color: var(--danger);
}


/* ================================
   ERROR
================================ */

.error-container {
    width: 90%;
    max-width: 600px;
    margin: 70px auto;
    background: white;
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.error-container h2 {
    margin-bottom: 15px;
}

.error-container p {
    color: var(--gray);
    margin-bottom: 25px;
}

.back-btn {
    display: inline-block;
    padding: 12px 22px;
    background: var(--primary);
    color: white;
    border-radius: 8px;
    font-weight: 700;
}


/* ================================
   FOOTER
================================ */

footer {
    background: var(--dark);
    color: white;
    padding: 40px 5%;
    text-align: center;
    margin-top: 50px;
}

footer h3 {
    font-family: "Playfair Display", serif;
    margin-bottom: 10px;
}

footer p {
    color: #d1d5db;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 850px) {

    header {
        flex-wrap: wrap;
    }

    .search-box {
        order: 3;
        max-width: none;
        width: 100%;
    }

    .product-card {
        grid-template-columns: 1fr;
        padding: 20px;
    }

    .main-image-wrapper {
        height: 400px;
    }

    .product-name {
        font-size: 30px;
    }

}


@media (max-width: 500px) {

    body {
        overflow-x: hidden;
    }

    header {
        padding: 10px 12px;
        gap: 10px;
    }

    .logo {
        font-size: 21px;
    }

    .header-actions {
        gap: 7px;
        font-size: 12px;
    }

    .header-actions a {
        font-size: 12px;
    }

    .cart-link {
        font-size: 12px;
    }

    .search-box {
        width: 100%;
    }

    .search-box input {
        padding: 10px 11px;
        font-size: 14px;
    }

    .search-box button {
        padding: 10px 13px;
        font-size: 13px;
    }

    .breadcrumb {
        padding: 12px;
        font-size: 12px;
    }

    .product-container {
        width: 100%;
        margin: 0 0 30px;
    }

    .product-card {
        width: 100%;
        border-radius: 0;
        padding: 12px;
        box-shadow: none;
        gap: 20px;
    }

    .main-image-wrapper {
        height: 260px;
        border-radius: 12px;
    }

    #mainProductImage {
        max-width: 100%;
        max-height: 100%;
    }

    .image-arrow {
        width: 36px;
        height: 36px;
        font-size: 24px;
    }

    .image-arrow.left {
        left: 8px;
    }

    .image-arrow.right {
        right: 8px;
    }

    .image-counter {
        bottom: 8px;
        font-size: 11px;
        padding: 5px 9px;
    }

    .thumbnail-container {
        gap: 7px;
        margin-top: 10px;
    }

    .thumbnail {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
    }

    .product-category {
        font-size: 12px;
        margin-bottom: 6px;
    }

    .product-name {
        font-size: 24px;
        line-height: 1.2;
        margin-bottom: 7px;
    }

    .product-sku {
        font-size: 12px;
        margin-bottom: 12px;
    }

    .product-price {
        font-size: 22px;
        margin-bottom: 12px;
    }

    .stock-badge {
        padding: 6px 10px;
        font-size: 11px;
        margin-bottom: 15px;
    }

    .product-description {
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 18px;
    }

    .quantity-title {
        font-size: 14px;
        margin-bottom: 7px;
    }

    .quantity-controls {
        margin-bottom: 18px;
    }

    .quantity-controls button {
        width: 38px;
        height: 38px;
        font-size: 19px;
    }

    .quantity-controls input {
        width: 55px;
        height: 38px;
        font-size: 14px;
    }

    .action-buttons {
        gap: 8px;
    }

    .action-btn {
        min-width: 100%;
        padding: 12px 15px;
        font-size: 14px;
    }

    .message {
        font-size: 13px;
        margin-top: 12px;
    }

    footer {
        padding: 25px 12px;
        margin-top: 30px;
    }

    footer h3 {
        font-size: 18px;
    }

    footer p {
        font-size: 12px;
    }

}


</style>

</head>

<body>


<header>

    <a
        href="/"
        class="logo"
        data-store-name
    >
        NED HUB
    </a>


    <div class="search-box">

        <form id="searchForm">

            <input
                type="search"
                id="searchInput"
                placeholder="Search products..."
            >

            <button type="submit">
                Search
            </button>

        </form>

    </div>


    <div
        class="header-actions"
        id="headerActions"
    >


        <a
            href="/account.html"
            id="accountLink"
            style="display:none;"
        >
            My Account
        </a>


        <a
            href="#"
            id="logoutLink"
            style="display:none;"
        >
            Logout
        </a>


        <a
            href="/checkout.html"
            class="cart-link"
        >
            🛒 Cart

            <span
                id="cartCount"
                class="cart-count"
            >
                0
            </span>

        </a>

    </div>

</header>


<div class="breadcrumb">

    <a href="/">
        Home
    </a>

    <span>
        /
    </span>

    <span id="breadcrumbProduct">
        Product
    </span>

</div>


<div
    id="loading"
    class="loading"
>

    <div class="spinner"></div>

    Loading product...

</div>


<div
    id="productContainer"
    class="product-container"
    style="display:none;"
>

    <div class="product-card">


        <!-- IMAGE SECTION -->

        <div class="image-section">

            <div class="main-image-wrapper">

                <img
                    id="mainProductImage"
                    src=""
                    alt="Product"
                    style="display:none;"
                >


                <div
                    id="imagePlaceholder"
                    class="image-placeholder"
                    style="display:none;"
                >
                    No product image available
                </div>


                <button
                    id="previousImage"
                    class="image-arrow left"
                    type="button"
                    onclick="event.stopPropagation(); previousPhoto();"
                    style="display:none;"
                >
                    ‹
                </button>


                <button
                    id="nextImage"
                    class="image-arrow right"
                    type="button"
                    onclick="event.stopPropagation(); nextPhoto();"
                    style="display:none;"
                >
                    ›
                </button>


                <div
                    id="imageCounter"
                    class="image-counter"
                    style="display:none;"
                >
                    1 / 1
                </div>

            </div>


            <div
                id="thumbnailContainer"
                class="thumbnail-container"
            ></div>

        </div>


        <!-- PRODUCT INFO -->

        <div class="product-info">

            <div
                id="productCategory"
                class="product-category"
            >
                Category
            </div>


            <h1
                id="productName"
                class="product-name"
            >
                Product
            </h1>


            <div
                id="productSku"
                class="product-sku"
            ></div>


            <div
                id="productPrice"
                class="product-price"
            >
                0.00
            </div>


            <div
                id="stockBadge"
                class="stock-badge"
            >
                Checking stock...
            </div>


            <div
                id="productDescription"
                class="product-description"
            ></div>


            <div class="quantity-title">
                Quantity
            </div>


            <div class="quantity-controls">

                <button
                    type="button"
                    onclick="event.stopPropagation(); decreaseQuantity();"
                >
                    −
                </button>


                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1"
                    onchange="validateQuantity();"
                >


                <button
                    type="button"
                    onclick="event.stopPropagation(); increaseQuantity();"
                >
                    +
                </button>

            </div>


            <div class="action-buttons">

                <button
                    id="addToCartBtn"
                    class="action-btn add-cart"
                    type="button"
                    onclick="addToCart(false)"
                >
                    Add to Cart
                </button>


                <button
                    id="buyNowBtn"
                    class="action-btn buy-now"
                    type="button"
                    onclick="buyNow()"
                >
                    Buy Now
                </button>

            </div>


            <div
                id="message"
                class="message"
            ></div>

        </div>

    </div>

</div>


<div
    id="errorContainer"
    class="error-container"
    style="display:none;"
>

    <h2>
        Product Not Found
    </h2>


    <p id="errorMessage">
        The product you are looking for could not be found.
    </p>


    <a
        href="/"
        class="back-btn"
    >
        Back to Shop
    </a>

</div>


<footer>

    <h3 data-store-name>
        NED HUB
    </h3>

    <p data-store-tagline>
        Your trusted online shopping destination.
    </p>

</footer>


<script>

const API = "/api";

const params =
    new URLSearchParams(
        window.location.search
    );

const productId =
    params.get("id");

let product = null;

let productPhotos = [];

let currentPhotoIndex = 0;


/* ================================
   CART
================================ */

function getCart() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "nedHubCart"
            )
        ) || [];

    } catch (error) {

        return [];

    }

}


function saveCart(cart) {

    localStorage.setItem(
        "nedHubCart",
        JSON.stringify(cart)
    );

}


function updateCartCount() {

    let cart = [];

    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "nedHubCart"
                )
            ) || [];

    } catch (error) {

        cart = [];

    }


    const count =
        cart.reduce(
            (total, item) =>
                total +
                Number(
                    item.quantity || 0
                ),
            0
        );


    const cartCount =
        document.getElementById(
            "cartCount"
        );


    if (cartCount) {

        cartCount.textContent =
            count;

    }

}


/* ================================
   LOAD PRODUCT
================================ */

async function loadProduct() {

    if (!productId) {

        showProductError(
            "Invalid product ID."
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/products`
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load products."
            );

        }


        const data =
            await response.json();


        const products =
            Array.isArray(data)
                ? data
                : data.products || [];


        product =
            products.find(
                item =>
                    String(item.id) ===
                    String(productId)
            );


        if (!product) {

            showProductError(
                "The product you are looking for does not exist."
            );

            return;

        }


        renderProduct(product);

        await loadProductPhotos();


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "productContainer"
        ).style.display =
            "block";


    } catch (error) {

        console.error(
            "Product loading error:",
            error
        );


        showProductError(
            "Unable to load this product. Please try again."
        );

    }

}


/* ================================
   RENDER PRODUCT
================================ */

function renderProduct(item) {

    /*
       Get the current shop name.
       site-settings.js will also update
       the page title when settings load.
    */

    const settings =
        window.NED_HUB_SETTINGS || {};

    const shopName =
        settings.store_name ||
        settings.header_store_name ||
        "NED HUB";


    document.title =
        `${item.name || "Product"} | ${shopName}`;


    document.getElementById(
        "breadcrumbProduct"
    ).textContent =
        item.name ||
        "Product";


    document.getElementById(
        "productName"
    ).textContent =
        item.name ||
        "Unnamed Product";


    document.getElementById(
        "productCategory"
    ).textContent =
        item.category_name ||
        item.category ||
        "Product";


    document.getElementById(
        "productPrice"
    ).textContent =
        formatPrice(
            item.price
        );


    document.getElementById(
        "productDescription"
    ).textContent =
        item.description ||
        "No description available.";


    document.getElementById(
        "productSku"
    ).textContent =
        item.sku
            ? `SKU: ${item.sku}`
            : "";


    const quantity =
        document.getElementById(
            "quantity"
        );


    const stock =
        Number(
            item.stock || 0
        );


    quantity.max =
        stock;


    updateStockDisplay();

}


/* ================================
   PRICE
================================ */

function formatPrice(price) {

    const number =
        Number(
            price || 0
        );


    return `GH₵ ${number.toFixed(2)}`;

}


/* ================================
   STOCK
================================ */

function updateStockDisplay() {

    if (!product) {
        return;
    }


    const stock =
        Number(
            product.stock || 0
        );


    const badge =
        document.getElementById(
            "stockBadge"
        );


    const addButton =
        document.getElementById(
            "addToCartBtn"
        );


    const buyButton =
        document.getElementById(
            "buyNowBtn"
        );


    if (stock > 0) {

        badge.textContent =
            `${stock} item${stock === 1 ? "" : "s"} available`;


        badge.className =
            "stock-badge in-stock";


        addButton.disabled =
            false;


        buyButton.disabled =
            false;


    } else {

        badge.textContent =
            "Out of stock";


        badge.className =
            "stock-badge out-stock";


        addButton.disabled =
            true;


        buyButton.disabled =
            true;

    }

}


/* ================================
   LOAD PRODUCT PHOTOS
================================ */

async function loadProductPhotos() {

    productPhotos = [];

    currentPhotoIndex = 0;


    /*
       Main product image
    */

    if (
        product &&
        product.main_image
    ) {

        productPhotos.push(
            product.main_image
        );

    }


    /*
       Additional product images
    */

    try {

        const response =
            await fetch(
                `${API}/products/${productId}/images`
            );


        if (response.ok) {

            const data =
                await response.json();


            const images =
                Array.isArray(data)
                    ? data
                    : data.images || [];


            images.forEach(
                image => {

                    const imageUrl =
                        image.image_url ||
                        image.url ||
                        image.path;


                    if (
                        imageUrl &&
                        !productPhotos.includes(
                            imageUrl
                        )
                    ) {

                        productPhotos.push(
                            imageUrl
                        );

                    }

                }
            );

        }

    } catch (error) {

        console.log(
            "Additional images unavailable:",
            error.message
        );

    }


    renderPhotos();

}


/* ================================
   RENDER PHOTOS
================================ */

function renderPhotos() {

    const mainImage =
        document.getElementById(
            "mainProductImage"
        );


    const placeholder =
        document.getElementById(
            "imagePlaceholder"
        );


    const thumbnailContainer =
        document.getElementById(
            "thumbnailContainer"
        );


    const previousButton =
        document.getElementById(
            "previousImage"
        );


    const nextButton =
        document.getElementById(
            "nextImage"
        );


    const counter =
        document.getElementById(
            "imageCounter"
        );


    thumbnailContainer.innerHTML =
        "";


    if (!productPhotos.length) {

        mainImage.style.display =
            "none";


        placeholder.style.display =
            "block";


        previousButton.style.display =
            "none";


        nextButton.style.display =
            "none";


        counter.style.display =
            "none";


        return;

    }


    placeholder.style.display =
        "none";


    mainImage.style.display =
        "block";


    const currentPhoto =
        productPhotos[
            currentPhotoIndex
        ];


    mainImage.src =
        currentPhoto;


    mainImage.alt =
        product?.name ||
        "Product";


    /*
       Multiple images
    */

    if (
        productPhotos.length > 1
    ) {

        previousButton.style.display =
            "flex";


        nextButton.style.display =
            "flex";


        counter.style.display =
            "block";


        counter.textContent =
            `${currentPhotoIndex + 1} / ${productPhotos.length}`;


    } else {

        previousButton.style.display =
            "none";


        nextButton.style.display =
            "none";


        counter.style.display =
            "none";

    }


    /*
       Thumbnails
    */

    productPhotos.forEach(
        (
            photo,
            index
        ) => {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                photo;


            img.alt =
                `${product?.name || "Product"} image ${index + 1}`;


            img.className =
                "thumbnail";


            if (
                index ===
                currentPhotoIndex
            ) {

                img.classList.add(
                    "active"
                );

            }


            img.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    currentPhotoIndex =
                        index;


                    renderPhotos();

                }
            );


            thumbnailContainer.appendChild(
                img
            );

        }
    );

}


/* ================================
   PREVIOUS PHOTO
================================ */

function previousPhoto() {

    if (
        productPhotos.length <= 1
    ) {

        return;

    }


    currentPhotoIndex--;


    if (
        currentPhotoIndex < 0
    ) {

        currentPhotoIndex =
            productPhotos.length - 1;

    }


    renderPhotos();

}


/* ================================
   NEXT PHOTO
================================ */

function nextPhoto() {

    if (
        productPhotos.length <= 1
    ) {

        return;

    }


    currentPhotoIndex++;


    if (
        currentPhotoIndex >=
        productPhotos.length
    ) {

        currentPhotoIndex =
            0;

    }


    renderPhotos();

}


/* ================================
   QUANTITY
================================ */

function increaseQuantity() {

    if (!product) {
        return;
    }


    const input =
        document.getElementById(
            "quantity"
        );


    const stock =
        Number(
            product.stock || 0
        );


    let quantity =
        Number(
            input.value || 1
        );


    if (
        quantity < stock
    ) {

        quantity++;


        input.value =
            quantity;


    } else {

        showMessage(
            `Only ${stock} item${stock === 1 ? "" : "s"} available.`,
            "error"
        );

    }

}


function decreaseQuantity() {

    const input =
        document.getElementById(
            "quantity"
        );


    let quantity =
        Number(
            input.value || 1
        );


    if (
        quantity > 1
    ) {

        quantity--;


        input.value =
            quantity;

    }

}


function validateQuantity() {

    if (!product) {
        return;
    }


    const input =
        document.getElementById(
            "quantity"
        );


    const stock =
        Number(
            product.stock || 0
        );


    let quantity =
        parseInt(
            input.value,
            10
        );


    if (
        isNaN(quantity) ||
        quantity < 1
    ) {

        quantity = 1;

    }


    if (
        quantity > stock
    ) {

        quantity =
            stock;

    }


    input.value =
        quantity;

}


function getQuantity() {

    const input =
        document.getElementById(
            "quantity"
        );


    let quantity =
        parseInt(
            input.value,
            10
        );


    if (
        isNaN(quantity) ||
        quantity < 1
    ) {

        quantity = 1;

    }


    return quantity;

}


/* ================================
   ADD TO CART
================================ */

function addToCart(
    redirectAfter = false
) {

    if (!product) {

        alert(
            "Product information is not loaded yet."
        );

        return;

    }


    const stock =
        Number(
            product.stock || 0
        );


    if (
        stock <= 0
    ) {

        alert(
            "This product is out of stock."
        );

        return;

    }


    const quantityInput =
        document.getElementById(
            "quantity"
        );


    let quantity =
        parseInt(
            quantityInput.value,
            10
        );


    if (
        isNaN(quantity) ||
        quantity < 1
    ) {

        quantity = 1;

    }


    if (
        quantity > stock
    ) {

        alert(
            `Only ${stock} item${stock === 1 ? "" : "s"} available.`
        );

        return;

    }


    let cart = [];


    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "nedHubCart"
                )
            ) || [];

    } catch (error) {

        cart = [];

    }


    const existingIndex =
        cart.findIndex(
            item =>
                String(item.id) ===
                String(product.id)
        );


    if (
        existingIndex !== -1
    ) {

        const currentQuantity =
            Number(
                cart[
                    existingIndex
                ].quantity || 0
            );


        const newQuantity =
            currentQuantity +
            quantity;


        if (
            newQuantity > stock
        ) {

            alert(
                `You already have ${currentQuantity} in your cart. Only ${stock} available.`
            );

            return;

        }


        cart[
            existingIndex
        ].quantity =
            newQuantity;


    } else {

        cart.push({

            id:
                product.id,

            name:
                product.name,

            price:
                Number(
                    product.price || 0
                ),

            quantity:
                quantity,

            stock:
                stock,

            main_image:
                product.main_image ||
                "",

            category_name:
                product.category_name ||
                product.category ||
                ""

        });

    }


    localStorage.setItem(
        "nedHubCart",
        JSON.stringify(cart)
    );


    updateCartCount();


    alert(
        `${product.name} has been added to your cart.`
    );


    if (
        redirectAfter
    ) {

        window.location.href =
            "/checkout.html";

    }

}


/* ================================
   BUY NOW
================================ */

function buyNow() {

    addToCart(true);

}


/* ================================
   MESSAGE
================================ */

function showMessage(
    message,
    type
) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        message;


    element.className =
        `message ${type}`;


    element.style.display =
        "block";


    clearTimeout(
        window.messageTimer
    );


    window.messageTimer =
        setTimeout(
            () => {

                element.style.display =
                    "none";

            },
            3500
        );

}


/* ================================
   PRODUCT ERROR
================================ */

function showProductError(
    message
) {

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "productContainer"
    ).style.display =
        "none";


    document.getElementById(
        "errorContainer"
    ).style.display =
        "block";


    document.getElementById(
        "errorMessage"
    ).textContent =
        message;

}
