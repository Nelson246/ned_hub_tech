<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email - NED HUB</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .verify-container {
            background: white;
            width: 100%;
            max-width: 450px;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #1479ff;

            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .description {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        input {
            width: 100%;

            padding: 15px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 22px;

            text-align: center;

            letter-spacing: 8px;

            margin-bottom: 20px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #1479ff;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0d63d1;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="verify-container">

        <div class="logo">
            NED HUB
        </div>

        <h2>Verify Your Email</h2>

        <p class="description">
            Enter the 6-digit verification code sent to your email address.
        </p>

        <input
            type="email"
            id="email"
            placeholder="Email address"
            required
        >

        <input
            type="text"
            id="code"
            placeholder="000000"
            maxlength="6"
            inputmode="numeric"
            required
        >

        <button onclick="verifyEmail()">
            Verify Email
        </button>

        <div id="message"></div>

    </div>

    <script>

        async function verifyEmail() {

            const email =
                document.getElementById("email").value.trim();

            const code =
                document.getElementById("code").value.trim();

            const message =
                document.getElementById("message");

            message.className = "";
            message.textContent = "";

            if (!email || !code) {

                message.className = "error";

                message.textContent =
                    "Please enter your email and verification code.";

                return;
            }

            try {

                const response = await fetch(
                    "/api/verify-email",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            code: code
                        })
                    }
                );

                const data =
                    await response.json();

                if (data.success) {

                    message.className = "success";

                    message.textContent =
                        "Email verified successfully!";

                    setTimeout(() => {
                        window.location.href =
                            "/login.html";
                    }, 1500);

                } else {

                    message.className = "error";

                    message.textContent =
                        data.message;
                }

            } catch (error) {

                console.error(error);

                message.className = "error";

                message.textContent =
                    "Could not connect to the server.";
            }
        }

    </script>

    <script src="/js/site-settings.js"></script>

</body>
</html>
