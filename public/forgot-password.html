<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - NED HUB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0080ff, #00aaff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #0080ff;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #0080ff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #0080ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #006bd6;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            display: none;
            line-height: 1.4;
        }

        .success {
            display: block;
            background: #e8f8ee;
            color: #16743b;
        }

        .error {
            display: block;
            background: #ffeaea;
            color: #b00020;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0080ff;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        NED HUB
    </div>

    <h2>
        Forgot Password?
    </h2>

    <p class="description">
        Enter the email address associated with your
        NED HUB account and we'll send you a secure
        password reset link.
    </p>

    <form id="forgotForm">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <button
            type="submit"
            id="submitButton"
        >
            Send Reset Link
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

    <a
        href="/login.html"
        class="back"
    >
        ← Back to Login
    </a>

</div>

<script>

const form =
    document.getElementById("forgotForm");

const emailInput =
    document.getElementById("email");

const button =
    document.getElementById("submitButton");

const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            emailInput.value.trim();

        if (!email) {
            showMessage(
                "Please enter your email address.",
                "error"
            );
            return;
        }

        button.disabled = true;

        button.textContent =
            "Sending...";

        message.className =
            "message";

        message.style.display =
            "none";

        try {

            const response =
                await fetch(
                    "/api/forgot-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to process request."
                );
            }

            showMessage(
                data.message,
                "success"
            );

            emailInput.value = "";

        } catch (error) {

            console.error(
                "Forgot password error:",
                error
            );

            showMessage(
                error.message ||
                "Something went wrong. Please try again.",
                "error"
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Send Reset Link";
        }
    }
);


function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}

</script>
<script src="/js/site-settings.js"></script>

</body>
</html>
