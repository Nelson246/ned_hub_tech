<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* HEADER */
        header {
            background: #0d47a1;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* PAGE */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            min-height: 500px;
        }

        h1 {
            margin-bottom: 25px;
            color: #0d47a1;
        }

        /* CART */
        .cart-wrapper {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        .cart-items {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .product-image {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            background: #eee;
        }

        .product-info {
            flex: 1;
        }

        .product-info h3 {
            margin-bottom: 8px;
            color: #222;
        }

        .price {
            color: #0d47a1;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* QUANTITY */
        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 32px;
            height: 32px;
            border: none;
            background: #0d47a1;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity button:hover {
            background: #083477;
        }

        .quantity span {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        .remove-btn {
            border: none;
            background: #e53935;
            color: white;
            padding: 9px 13px;
            border-radius: 6px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #b71c1c;
        }

        /* SUMMARY */
        .summary {
            background: white;
            padding: 25px;
            border-radius: 12px;
            height: fit-content;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .summary h2 {
            margin-bottom: 20px;
            color: #0d47a1;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 15px 0;
        }

        .total {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #0d47a1;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .checkout-btn:hover {
            background: #083477;
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #eee;
            color: #333;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: #ddd;
        }

        /* EMPTY CART */
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
            color: #555;
        }

        .empty-cart p {
            margin-bottom: 25px;
            color: #777;
        }

        .shop-btn {
            display: inline-block;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 7px;
        }

        .shop-btn:hover {
            background: #083477;
        }

        /* FOOTER */
        footer {
            margin-top: 50px;
            background: #0d47a1;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .cart-wrapper {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        @media (max-width: 600px) {

            .cart-item {
                flex-wrap: wrap;
            }

            .product-image {
                width: 80px;
                height: 80px;
            }

            .product-info {
                min-width: 180px;
            }

            .remove-btn {
                margin-left: auto;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo" data-store-name>
        NED HUB
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Shop
        </a>

        <a href="account.html">
            My Account
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

    </nav>

</header>

<div class="container">

    <h1>
        Shopping Cart
    </h1>

    <div id="cartContent"></div>

</div>

<footer>

    <p>
        &copy; 2026 <span data-store-name>NED HUB</span>. All Rights Reserved.
    </p>

</footer>

<script>

    // ==========================================
    // NED HUB CART STORAGE
    // ==========================================

    const CART_KEY = "nedHubCart";


    // ==========================================
    // GET CART
    // ==========================================

    function getCart() {

        try {

            const cart = JSON.parse(
                localStorage.getItem(CART_KEY)
            );

            return Array.isArray(cart) ? cart : [];

        } catch (error) {

            console.error(
                "Error reading cart:",
                error
            );

            return [];

        }
    }


    // ==========================================
    // SAVE CART
    // ==========================================

    function saveCart(cart) {

        localStorage.setItem(
            CART_KEY,
            JSON.stringify(cart)
        );

    }


    // ==========================================
    // FORMAT MONEY
    // ==========================================

    function formatMoney(amount) {

        return "GH₵ " +
            Number(amount || 0).toFixed(2);

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(value) {

        const div =
            document.createElement("div");

        div.textContent =
            String(value ?? "");

        return div.innerHTML;

    }


    // ==========================================
    // DISPLAY CART
    // ==========================================

    function displayCart() {

        const cart = getCart();

        const cartContent =
            document.getElementById("cartContent");


        // ======================================
        // EMPTY CART
        // ======================================

        if (cart.length === 0) {

            cartContent.innerHTML = `

                <div class="cart-items empty-cart">

                    <h2>
                        Your cart is empty
                    </h2>

                    <p>
                        You haven't added any products
                        to your cart yet.
                    </p>

                    <a
                        href="index.html#products"
                        class="shop-btn">

                        Continue Shopping

                    </a>

                </div>

            `;

            return;
        }


        let subtotal = 0;

        let itemsHTML = "";


        // ======================================
        // CREATE CART ITEMS
        // ======================================

        cart.forEach((item, index) => {

            const quantity =
                Number(item.quantity) || 1;

            const price =
                Number(item.price) || 0;

            const itemTotal =
                price * quantity;

            subtotal += itemTotal;


            const image =
                item.image ||
                item.imageUrl ||
                item.image_url ||
                "images/no-image.png";


            const name =
                item.name ||
                item.title ||
                "Product";


            itemsHTML += `

                <div class="cart-item">

                    <img
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(name)}"
                        class="product-image"
                        onerror="this.src='images/no-image.png'"
                    >

                    <div class="product-info">

                        <h3>
                            ${escapeHTML(name)}
                        </h3>

                        <div class="price">
                            ${formatMoney(price)}
                        </div>

                        <div class="quantity">

                            <button
                                onclick="decreaseQuantity(${index})">

                                −

                            </button>

                            <span>
                                ${quantity}
                            </span>

                            <button
                                onclick="increaseQuantity(${index})">

                                +

                            </button>

                        </div>

                    </div>

                    <div>

                        <strong>
                            ${formatMoney(itemTotal)}
                        </strong>

                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})">

                        Remove

                    </button>

                </div>

            `;

        });


        // ======================================
        // DISPLAY EVERYTHING
        // ======================================

        cartContent.innerHTML = `

            <div class="cart-wrapper">

                <div class="cart-items">

                    ${itemsHTML}

                </div>

                <div class="summary">

                    <h2>
                        Order Summary
                    </h2>

                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong>
                            ${formatMoney(subtotal)}
                        </strong>

                    </div>

                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <span>
                            Calculated at checkout
                        </span>

                    </div>

                    <div class="summary-row total">

                        <span>
                            Total
                        </span>

                        <span>
                            ${formatMoney(subtotal)}
                        </span>

                    </div>

                    <button
                        class="checkout-btn"
                        onclick="checkout()">

                        Proceed to Checkout

                    </button>

                    <button
                        class="clear-btn"
                        onclick="clearCart()">

                        Clear Cart

                    </button>

                </div>

            </div>

        `;

    }


    // ==========================================
    // INCREASE QUANTITY
    // ==========================================

    function increaseQuantity(index) {

        const cart = getCart();

        if (!cart[index]) return;

        cart[index].quantity =
            (Number(cart[index].quantity) || 1) + 1;

        saveCart(cart);

        displayCart();

    }


    // ==========================================
    // DECREASE QUANTITY
    // ==========================================

    function decreaseQuantity(index) {

        const cart = getCart();

        if (!cart[index]) return;

        const quantity =
            Number(cart[index].quantity) || 1;

        if (quantity > 1) {

            cart[index].quantity =
                quantity - 1;

        } else {

            cart.splice(index, 1);

        }

        saveCart(cart);

        displayCart();

    }


    // ==========================================
    // REMOVE ITEM
    // ==========================================

    function removeItem(index) {

        const cart = getCart();

        if (!cart[index]) return;

        cart.splice(index, 1);

        saveCart(cart);

        displayCart();

    }


    // ==========================================
    // CLEAR CART
    // ==========================================

    function clearCart() {

        const cart = getCart();

        if (cart.length === 0) return;

        const confirmClear =
            confirm(
                "Are you sure you want to clear your cart?"
            );

        if (!confirmClear) return;

        localStorage.removeItem(CART_KEY);

        displayCart();

    }


    // ==========================================
    // CHECKOUT
    // ==========================================

    function checkout() {

        const cart = getCart();

        if (cart.length === 0) {

            alert("Your cart is empty.");

            return;

        }

        window.location.href =
            "checkout.html";

    }


    // ==========================================
    // LOAD CART
    // ==========================================

    displayCart();

</script>


<!-- ==========================================
     GLOBAL NED HUB SITE SETTINGS
========================================== -->

<script src="/js/site-settings.js"></script>

</body>
</html>
