<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - NED HUB</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #1479ff;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header h1 a {
            color: white;
            text-decoration: none;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top h2 {
            font-size: 28px;
        }

        .back-btn {
            background: #1479ff;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .order-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .order-number {
            font-weight: bold;
            font-size: 18px;
        }

        .date {
            color: #777;
            font-size: 14px;
            margin-top: 5px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-box {
            background: #f7f9fc;
            padding: 15px;
            border-radius: 8px;
        }

        .detail-box span.label {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .detail-box strong {
            font-size: 16px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .confirmed {
            background: #d4edda;
            color: #155724;
        }

        .processing {
            background: #cce5ff;
            color: #004085;
        }

        .paid {
            background: #d4edda;
            color: #155724;
        }

        .failed,
        .cancelled {
            background: #ffe5e5;
            color: #c00;
        }

        .empty {
            background: white;
            text-align: center;
            padding: 60px 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .empty h3 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #777;
            margin-bottom: 20px;
        }

        .shop-btn {
            display: inline-block;
            background: #1479ff;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #ffe5e5;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .products-title {
            margin-bottom: 12px;
        }

        .product-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .product-row:last-child {
            border-bottom: none;
        }

        .product-image,
        .no-image {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #eee;
            flex-shrink: 0;
        }

        .no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #777;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: bold;
        }

        .product-meta {
            color: #777;
            font-size: 14px;
            margin-top: 4px;
        }

        .product-total {
            font-weight: bold;
            white-space: nowrap;
        }

        .delivery-section {
            margin-top: 20px;
        }

        .delivery-section strong {
            display: block;
            margin-bottom: 8px;
        }

        .delivery-address {
            color: #666;
            line-height: 1.5;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            header a {
                margin: 0 8px;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .product-row {
                align-items: flex-start;
            }

            .product-total {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>
        <a href="/">
            <span data-shop-name>NED HUB</span>
        </a>
    </h1>

    <div>
        <a href="/">Shop</a>
        <a href="/account.html">Account</a>
    </div>

</header>


<div class="container">

    <div class="top">

        <h2>My Orders</h2>

        <a href="/account.html" class="back-btn">
            ← Account
        </a>

    </div>


    <div id="ordersContainer">

        <div class="loading">
            Loading your orders...
        </div>

    </div>

</div>


<script>

async function loadOrders() {

    const container = document.getElementById("ordersContainer");

    try {

        const response = await fetch("/api/my-orders", {
            credentials: "include"
        });

        const data = await response.json();

        if (!response.ok || !data.success) {

            if (response.status === 401) {
                window.location.href = "/login.html";
                return;
            }

            throw new Error(
                data.message || "Failed to load orders."
            );
        }


        if (!data.orders || data.orders.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <h3>No orders yet</h3>

                    <p>
                        You haven't placed any orders yet.
                    </p>

                    <a href="/" class="shop-btn">
                        Start Shopping
                    </a>

                </div>
            `;

            return;
        }


        container.innerHTML = data.orders.map(order => {

            const date = new Date(order.created_at);

            const formattedDate =
                date.toLocaleDateString("en-GH", {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                });


            const statusClass =
                String(order.status || "pending")
                    .toLowerCase()
                    .replace(/\s+/g, "-");


            const paymentClass =
                String(order.payment_status || "pending")
                    .toLowerCase()
                    .replace(/\s+/g, "-");


            /*
             * Delivery fee display:
             * Accra = FREE
             * Outside Accra = ---
             *
             * We use the saved delivery address/city to determine
             * what is displayed to the customer.
             */

            const city = String(order.city || "").trim().toLowerCase();

            let deliveryDisplay = "---";

            if (city === "accra") {
                deliveryDisplay = "FREE";
            }


            return `

                <div class="order-card">

                    <div class="order-header">

                        <div>

                            <div class="order-number">
                                Order #${order.id}
                            </div>

                            <div class="date">
                                ${formattedDate}
                            </div>

                        </div>

                        <span class="status ${statusClass}">
                            ${order.status || "Pending"}
                        </span>

                    </div>


                    <div class="details">

                        <div class="detail-box">

                            <span class="label">
                                Total
                            </span>

                            <strong>
                                GHS ${Number(order.total || 0).toFixed(2)}
                            </strong>

                        </div>


                        <div class="detail-box">

                            <span class="label">
                                Payment
                            </span>

                            <strong>
                                <span class="status ${paymentClass}">
                                    ${order.payment_status || "Pending"}
                                </span>
                            </strong>

                        </div>


                        <div class="detail-box">

                            <span class="label">
                                Delivery Fee
                            </span>

                            <strong>
                                ${deliveryDisplay}
                            </strong>

                        </div>

                    </div>


                    <div>

                        <strong class="products-title">
                            Products Ordered
                        </strong>

                        <div>

                            ${
                                order.items && order.items.length > 0

                                ? order.items.map(item => `

                                    <div class="product-row">

                                        ${
                                            item.main_image

                                            ? `
                                                <img
                                                    src="${item.main_image}"
                                                    alt="${item.name}"
                                                    class="product-image"
                                                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                                                >

                                                <div
                                                    class="no-image"
                                                    style="display:none;"
                                                >
                                                    No Image
                                                </div>
                                            `

                                            : `
                                                <div class="no-image">
                                                    No Image
                                                </div>
                                            `
                                        }


                                        <div class="product-info">

                                            <div class="product-name">
                                                ${item.name}
                                            </div>

                                            <div class="product-meta">

                                                Quantity:
                                                ${item.quantity}

                                                ×

                                                GHS
                                                ${Number(item.price || 0).toFixed(2)}

                                            </div>

                                        </div>


                                        <div class="product-total">

                                            GHS
                                            ${(
                                                Number(item.price || 0) *
                                                Number(item.quantity || 0)
                                            ).toFixed(2)}

                                        </div>

                                    </div>

                                `).join("")

                                : `
                                    <p style="color:#777;">
                                        No product details available.
                                    </p>
                                `
                            }

                        </div>

                    </div>


                    <div class="delivery-section">

                        <strong>
                            Delivery Address
                        </strong>

                        <p class="delivery-address">
                            ${order.delivery_address || "No delivery address available."}
                        </p>

                    </div>


                </div>

            `;

        }).join("");


    } catch (error) {

        console.error("Orders error:", error);

        container.innerHTML = `
            <div class="error">
                ${error.message}
            </div>
        `;

    }

}


loadOrders();

</script>


<script src="/js/site-settings.js"></script>

<script src="/js/site-settings.js"></script>

</body>
</html>
