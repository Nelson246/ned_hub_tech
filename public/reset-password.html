<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - NED HUB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0080ff, #00aaff);
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow: 0 15px 40px rgba(0,0,0,.2);
        }

        .logo {
            text-align: center;

            color: #0080ff;

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        h2 {
            text-align: center;

            margin: 0 0 10px;
        }

        .description {
            text-align: center;

            color: #666;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            margin-bottom: 18px;

            outline: none;
        }

        input:focus {
            border-color: #0080ff;
        }

        button {
            width: 100%;

            padding: 14px;

            background: #0080ff;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #006bd6;
        }

        button:disabled {
            opacity: .7;

            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            line-height: 1.5;
        }

        .success {
            display: block;

            background: #e8f8ee;

            color: #16743b;
        }

        .error {
            display: block;

            background: #ffeaea;

            color: #b00020;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #0080ff;

            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        NED HUB
    </div>

    <h2>
        Reset Password
    </h2>

    <p class="description">
        Create a new password for your NED HUB account.
    </p>

    <form id="resetForm">

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <button
            type="submit"
            id="resetButton"
        >
            Reset Password
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

    <a
        href="/login.html"
        class="back"
    >
        ← Back to Login
    </a>

</div>

<script>

const resetForm =
    document.getElementById("resetForm");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const resetButton =
    document.getElementById("resetButton");

const message =
    document.getElementById("message");


// Get token from email link
const urlParams =
    new URLSearchParams(
        window.location.search
    );

const token =
    urlParams.get("token");


// Check token
if (!token) {

    resetForm.style.display =
        "none";

    showMessage(
        "This password reset link is invalid. Please request a new reset link.",
        "error"
    );
}


// Submit reset
resetForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        if (!token) {

            showMessage(
                "Invalid reset link.",
                "error"
            );

            return;
        }


        if (password.length < 8) {

            showMessage(
                "Password must be at least 8 characters.",
                "error"
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "The passwords do not match.",
                "error"
            );

            return;
        }


        resetButton.disabled =
            true;

        resetButton.textContent =
            "Resetting...";


        try {

            const response =
                await fetch(
                    "/api/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            token: token,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Password reset failed."
                );
            }


            resetForm.style.display =
                "none";


            showMessage(
                "Your password has been reset successfully. Redirecting to login...",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "/login.html";

                },
                2500
            );


        } catch (error) {

            console.error(
                "Reset password error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to reset password.",
                "error"
            );


            resetButton.disabled =
                false;

            resetButton.textContent =
                "Reset Password";
        }

    }
);


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}

</script>


    <script src="/js/site-settings.js"></script>
    
</body>
</html>
