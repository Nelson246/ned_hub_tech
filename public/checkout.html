<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: #071a33;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #1479ff;
        }

        .order-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .order-item img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 7px;
            background: #eee;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .order-item-price {
            color: #555;
            font-size: 14px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
        }

        .total-row {
            border-top: 2px solid #eee;
            margin-top: 10px;
            padding-top: 18px;
            font-size: 21px;
            font-weight: bold;
        }

        .pay-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            background: #1479ff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .pay-btn:hover {
            background: #0b63d1;
        }

        .pay-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .empty-cart {
            text-align: center;
            padding: 40px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #1479ff;
            text-decoration: none;
        }

        .message {
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 15px;
            display: none;
        }

        .error {
            background: #ffe1e1;
            color: #b00020;
        }

        @media (max-width: 750px) {

            .checkout-grid {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 25px;
            }

        }

    </style>

</head>

<body>

<header>

    <div
        class="logo"
        data-store-name
    >
        NED HUB
    </div>

    <a href="index.html">
        ← Continue Shopping
    </a>

</header>


<main class="container">

    <h1>
        Checkout
    </h1>


    <div
        id="errorMessage"
        class="message error"
    ></div>


    <div class="checkout-grid">


        <!-- =========================
             CUSTOMER DETAILS
        ========================== -->

        <div class="card">

            <h2>
                Delivery Information
            </h2>


            <form id="checkoutForm">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                        placeholder="Enter your full name"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="you@example.com"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        required
                        placeholder="024 XXX XXXX"
                    >

                </div>


                <div class="form-group">

                    <label for="savedAddress">
                        Saved Delivery Address
                    </label>

                    <select id="savedAddress">

                        <option value="">
                            Select a saved address
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="address">
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        required
                        placeholder="House number, street, area..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="city">
                        City / Town
                    </label>

                    <input
                        type="text"
                        id="city"
                        required
                        placeholder="e.g. Accra"
                    >

                </div>


                <div class="form-group">

                    <label for="region">
                        Region
                    </label>

                    <select
                        id="region"
                        required
                    >

                        <option value="">
                            Select Region
                        </option>

                        <option>
                            Greater Accra
                        </option>

                        <option>
                            Ashanti
                        </option>

                        <option>
                            Eastern
                        </option>

                        <option>
                            Central
                        </option>

                        <option>
                            Western
                        </option>

                        <option>
                            Western North
                        </option>

                        <option>
                            Volta
                        </option>

                        <option>
                            Oti
                        </option>

                        <option>
                            Northern
                        </option>

                        <option>
                            Savannah
                        </option>

                        <option>
                            North East
                        </option>

                        <option>
                            Upper East
                        </option>

                        <option>
                            Upper West
                        </option>

                        <option>
                            Bono
                        </option>

                        <option>
                            Bono East
                        </option>

                        <option>
                            Ahafo
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="pay-btn"
                >
                    Continue to Payment
                </button>


            </form>

        </div>


        <!-- =========================
             ORDER SUMMARY
        ========================== -->

        <div class="card">

            <h2>
                Your Order
            </h2>


            <div id="orderItems">

                Loading cart...

            </div>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong id="subtotal">
                    GHS 0.00
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <strong id="deliveryFee">
                    ---
                </strong>

            </div>


            <div class="summary-row total-row">

                <span>
                    Total
                </span>

                <span id="total">
                    GHS 0.00
                </span>

            </div>

        </div>


    </div>

</main>


<script>

    // =========================
    // LOAD CART
    // =========================

    const cart =
        JSON.parse(
            localStorage.getItem(
                "nedHubCart"
            )
        ) || [];


    // =========================
    // DISPLAY ERROR
    // =========================

    function showError(message) {

        const box =
            document.getElementById(
                "errorMessage"
            );

        box.textContent =
            message;

        box.style.display =
            "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // =========================
    // DISPLAY ORDER
    // =========================

    function displayOrder() {

        const container =
            document.getElementById(
                "orderItems"
            );


        if (cart.length === 0) {

            container.innerHTML = `

                <div class="empty-cart">

                    <p>
                        Your cart is empty.
                    </p>

                    <a
                        href="index.html"
                        class="back-link"
                    >
                        Return to Shop
                    </a>

                </div>

            `;

            document.getElementById(
                "subtotal"
            ).textContent =
                "GHS 0.00";

            document.getElementById(
                "total"
            ).textContent =
                "GHS 0.00";

            return;

        }


        let subtotal = 0;

        let html = "";


        cart.forEach(item => {

            const itemTotal =
                Number(item.price || 0) *
                Number(item.quantity || 0);


            subtotal +=
                itemTotal;


            html += `

                <div class="order-item">

                    ${
                        item.image
                        ? `
                            <img
                                src="${escapeHtml(item.image)}"
                                alt="${escapeHtml(item.name)}"
                            >
                        `
                        : `
                            <div class="order-item img">
                                No Image
                            </div>
                        `
                    }


                    <div class="order-item-info">

                        <div class="order-item-name">

                            ${escapeHtml(
                                item.name
                            )}

                        </div>

                        <div class="order-item-price">

                            ${Number(item.quantity) || 0}
                            ×
                            GHS
                            ${Number(item.price || 0).toFixed(2)}

                        </div>

                    </div>


                    <strong>

                        GHS
                        ${itemTotal.toFixed(2)}

                    </strong>

                </div>

            `;

        });


        container.innerHTML =
            html;


        document.getElementById(
            "subtotal"
        ).textContent =
            "GHS " +
            subtotal.toFixed(2);


        document.getElementById(
            "total"
        ).textContent =
            "GHS " +
            subtotal.toFixed(2);

    }


    // =========================
    // ESCAPE HTML
    // =========================

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            String(text ?? "");

        return div.innerHTML;

    }


    // =========================
    // LOAD SAVED ADDRESSES
    // =========================

    async function loadSavedAddresses() {

        const select =
            document.getElementById(
                "savedAddress"
            );

        try {

            const response =
                await fetch(
                    "/api/addresses",
                    {
                        credentials: "include"
                    }
                );

            const data =
                await response.json();

            if (
                !response.ok ||
                !data.success
            ) {
                return;
            }

            if (
                !data.addresses ||
                data.addresses.length === 0
            ) {
                return;
            }

            data.addresses.forEach(
                address => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        address.id;

                    option.textContent =
                        `${address.full_name} - ${address.address}, ${address.city}, ${address.region}`;

                    if (
                        address.is_default
                    ) {

                        option.selected =
                            true;

                        document.getElementById(
                            "name"
                        ).value =
                            address.full_name;

                        document.getElementById(
                            "address"
                        ).value =
                            address.address;

                        document.getElementById(
                            "city"
                        ).value =
                            address.city;

                        document.getElementById(
                            "region"
                        ).value =
                            address.region;

                        calculateDeliveryFee();

                    }

                    select.appendChild(
                        option
                    );

                }
            );


            select.addEventListener(
                "change",
                function () {

                    const selectedId =
                        this.value;

                    const selectedAddress =
                        data.addresses.find(
                            address =>
                                String(
                                    address.id
                                ) ===
                                selectedId
                        );

                    if (!selectedAddress) {
                        return;
                    }

                    document.getElementById(
                        "name"
                    ).value =
                        selectedAddress.full_name;

                    document.getElementById(
                        "address"
                    ).value =
                        selectedAddress.address;

                    document.getElementById(
                        "city"
                    ).value =
                        selectedAddress.city;

                    document.getElementById(
                        "region"
                    ).value =
                        selectedAddress.region;

                    calculateDeliveryFee();

                }
            );

        } catch (error) {

            console.error(
                "Load saved addresses error:",
                error
            );

        }

    }


    // =========================
    // DELIVERY FEE CALCULATION
    // =========================

    function calculateDeliveryFee() {

        const city =
            document.getElementById(
                "city"
            )
            .value
            .trim()
            .toLowerCase();

        let deliveryFee = 0;


        // Only Accra is free

        if (city === "accra") {

            deliveryFee = 0;

            document.getElementById(
                "deliveryFee"
            ).textContent =
                "FREE";

        } else {

            // Outside Accra

            deliveryFee = null;

            document.getElementById(
                "deliveryFee"
            ).textContent =
                "---";

        }


        // Get subtotal

        const subtotalText =
            document.getElementById(
                "subtotal"
            )
            .textContent
            .replace("GHS", "")
            .trim();

        const subtotal =
            parseFloat(
                subtotalText
            ) || 0;


        // Outside Accra:
        // don't add a delivery charge

        document.getElementById(
            "total"
        ).textContent =
            "GHS " +
            subtotal.toFixed(2);


        return deliveryFee;

    }


    // =========================
    // CHECKOUT FORM
    // =========================

    document
        .getElementById(
            "checkoutForm"
        )
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const accountResponse =
                    await fetch(
                        "/api/account",
                        {
                            credentials:
                                "include"
                        }
                    );


                const accountData =
                    await accountResponse.json();


                if (
                    !accountData.success
                ) {

                    sessionStorage.setItem(
                        "nedHubReturnUrl",
                        window.location.pathname
                    );

                    window.location.href =
                        "/login.html";

                    return;

                }


                if (
                    !cart ||
                    cart.length === 0
                ) {

                    alert(
                        "Your cart is empty."
                    );

                    return;

                }


                const fullName =
                    document.getElementById(
                        "name"
                    )
                    .value
                    .trim();


                const email =
                    document.getElementById(
                        "email"
                    )
                    .value
                    .trim();


                const phone =
                    document.getElementById(
                        "phone"
                    )
                    .value
                    .trim();


                const address =
                    document.getElementById(
                        "address"
                    )
                    .value
                    .trim();


                const city =
                    document.getElementById(
                        "city"
                    )
                    .value
                    .trim();


                const region =
                    document.getElementById(
                        "region"
                    )
                    .value
                    .trim();


                if (
                    !fullName ||
                    !email ||
                    !phone ||
                    !address ||
                    !city ||
                    !region
                ) {

                    alert(
                        "Please fill in all delivery information."
                    );

                    return;

                }


                const deliveryAddress =
                    `${fullName}, ${phone}, ${address}, ${city}, ${region}`;


                const items =
                    cart.map(
                        item => ({

                            product_id:
                                Number(
                                    item.id
                                ),

                            quantity:
                                Number(
                                    item.quantity
                                )

                        })
                    );


                const button =
                    document.querySelector(
                        '#checkoutForm button[type="submit"]'
                    );


                if (button) {

                    button.disabled =
                        true;

                    button.textContent =
                        "Creating Order...";

                }


                try {

                    const response =
                        await fetch(
                            "/api/orders/create",
                            {
                                method:
                                    "POST",

                                credentials:
                                    "include",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        items:
                                            items,

                                        delivery_address:
                                            deliveryAddress,

                                        city:
                                            city,

                                        region:
                                            region

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.message ||
                            "Failed to create order."
                        );

                    }


                    console.log(
                        "Order created:",
                        data
                    );


                    // =========================
                    // ORDER CREATED SUCCESSFULLY
                    // =========================

                    localStorage.removeItem(
                        "nedHubCart"
                    );


                    alert(
                        "Order placed successfully! Your order number is #" +
                        data.orderId
                    );


                    window.location.href =
                        "/orders.html";


                } catch (error) {

                    console.error(
                        "Checkout error:",
                        error
                    );

                    alert(
                        error.message
                    );

                } finally {

                    if (button) {

                        button.disabled =
                            false;

                        button.textContent =
                            "Continue to Payment";

                    }

                }

            }
        );


    // =========================
    // START
    // =========================

    displayOrder();

    loadSavedAddresses();


    document
        .getElementById(
            "city"
        )
        .addEventListener(
            "input",
            calculateDeliveryFee
        );


    document
        .getElementById(
            "region"
        )
        .addEventListener(
            "change",
            calculateDeliveryFee
        );

</script>


<!-- ==========================================
     GLOBAL SITE SETTINGS
========================================== -->

<script src="/js/site-settings.js"></script>


</body>

</html>
