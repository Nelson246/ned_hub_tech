<title>Customer Care | NED HUB Admin</title>

<link rel="stylesheet" href="/admin/css/admin.css">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #222;
    }

    /* =========================
       CUSTOMER CARE HEADER
    ========================= */

    header {
        height: 65px;
        background: #0b2d5c;
        color: white;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 25px;

        /* Header starts after sidebar */
        margin-left: 250px;
        width: calc(100% - 250px);

        position: relative;
        z-index: 999;
    }

    header h1 {
        font-size: 21px;
        font-weight: 700;
    }

    .back {
        color: white;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.12);
        padding: 9px 14px;
        border-radius: 8px;
        transition: 0.2s ease;
    }

    .back:hover {
        background: #174b8c;
    }


    /* =========================
       MAIN CUSTOMER CARE AREA
    ========================= */

    .layout {
        display: flex;

        height: calc(100vh - 65px);

        margin-left: 250px;
        width: calc(100% - 250px);
    }


    /* =========================
       CUSTOMER LIST
    ========================= */

    .customers {
        width: 320px;
        flex-shrink: 0;

        background: white;

        border-right: 1px solid #ddd;

        overflow-y: auto;
    }

    .customers-header {
        padding: 18px;

        border-bottom: 1px solid #ddd;
    }

    .customers-header h2 {
        font-size: 18px;
        margin-bottom: 5px;
    }

    .customers-header p {
        color: #777;
        font-size: 13px;
    }

    .customer {
        padding: 15px;

        border-bottom: 1px solid #eee;

        cursor: pointer;

        transition: background 0.2s;
    }

    .customer:hover {
        background: #f4f7fb;
    }

    .customer.active {
        background: #e8f1ff;
        border-left: 4px solid #0b5ed7;
    }

    .customer-name {
        font-weight: bold;
        margin-bottom: 5px;
    }

    .customer-email {
        color: #777;
        font-size: 12px;
    }

    .customer-bottom {
        display: flex;

        justify-content: space-between;
        align-items: center;

        margin-top: 8px;
    }

    .last-message {
        font-size: 11px;
        color: #888;
    }

    .unread {
        background: #dc3545;
        color: white;

        min-width: 22px;
        height: 22px;

        padding: 0 6px;

        border-radius: 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 11px;
        font-weight: bold;
    }


    /* =========================
       CHAT
    ========================= */

    .chat {
        flex: 1;

        display: flex;
        flex-direction: column;

        min-width: 0;
    }

    .chat-header {
        background: white;

        padding: 17px 20px;

        border-bottom: 1px solid #ddd;
    }

    .chat-header h2 {
        font-size: 18px;
        margin-bottom: 5px;
    }

    .chat-header p {
        font-size: 13px;
        color: #777;
    }


    /* =========================
       MESSAGES
    ========================= */

    #messages {
        flex: 1;

        overflow-y: auto;

        padding: 20px;

        background: #f8fafc;
    }

    .empty {
        text-align: center;

        color: #888;

        padding: 50px 20px;
    }

    .message {
        display: flex;

        margin-bottom: 15px;
    }

    .message.customer {
        justify-content: flex-start;
    }

    .message.admin {
        justify-content: flex-end;
    }

    .bubble {
        max-width: 70%;

        padding: 11px 14px;

        border-radius: 14px;

        word-wrap: break-word;
    }

    .customer .bubble {
        background: white;

        border: 1px solid #ddd;

        border-bottom-left-radius: 4px;
    }

    .admin .bubble {
        background: #0b5ed7;

        color: white;

        border-bottom-right-radius: 4px;
    }

    .sender {
        font-size: 11px;

        font-weight: bold;

        margin-bottom: 5px;

        opacity: 0.7;
    }

    .time {
        font-size: 10px;

        margin-top: 5px;

        opacity: 0.7;
    }


    /* =========================
       MESSAGE INPUT
    ========================= */

    .input-area {
        display: flex;

        gap: 10px;

        background: white;

        border-top: 1px solid #ddd;

        padding: 14px;
    }

    #messageInput {
        flex: 1;

        min-height: 45px;
        max-height: 120px;

        resize: none;

        border: 1px solid #ccc;

        border-radius: 9px;

        padding: 12px;

        font-size: 14px;

        outline: none;
    }

    #messageInput:focus {
        border-color: #0b5ed7;
    }

    #sendBtn {
        border: none;

        background: #0b5ed7;

        color: white;

        padding: 0 20px;

        border-radius: 9px;

        cursor: pointer;

        font-weight: bold;
    }

    #sendBtn:hover {
        background: #084db2;
    }

    #sendBtn:disabled {
        opacity: 0.6;

        cursor: not-allowed;
    }

    .status {
        font-size: 12px;

        color: #777;

        text-align: center;

        padding: 5px;

        background: white;
    }

    .no-conversations {
        padding: 35px 20px;

        text-align: center;

        color: #888;

        font-size: 14px;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {

        header {
            margin-left: 210px;

            width: calc(100% - 210px);
        }

        .layout {
            margin-left: 210px;

            width: calc(100% - 210px);
        }

        .customers {
            width: 280px;
        }

        .bubble {
            max-width: 80%;
        }
    }


    /* =========================
       SMALL SCREEN
    ========================= */

    @media (max-width: 700px) {

        header {
            margin-left: 0;

            width: 100%;
        }

        .layout {
            margin-left: 0;

            width: 100%;
        }

        .customers {
            width: 250px;
        }

        .bubble {
            max-width: 85%;
        }
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 550px) {

        .customers {
            width: 100%;
        }

        .chat {
            display: none;
        }

        .layout.chat-open .customers {
            display: none;
        }

        .layout.chat-open .chat {
            display: flex;
        }

        header h1 {
            font-size: 16px;
        }

        .back {
            padding: 7px 10px;

            font-size: 12px;
        }
    }
</style>

```
<!-- =========================
     SHARED ADMIN SIDEBAR
========================== -->

<aside
    class="sidebar"
    id="adminSidebar">
</aside>


<!-- =========================
     CUSTOMER CARE HEADER
========================== -->

<header>

    <h1>
        💬 NED HUB Customer Care
    </h1>

    <a
        href="/admin/"
        class="back">
        ← Dashboard
    </a>

</header>


<!-- =========================
     CUSTOMER CARE CONTENT
========================== -->

<div
    class="layout"
    id="layout">


    <!-- CUSTOMER LIST -->

    <aside class="customers">

        <div class="customers-header">

            <h2>
                Customers
            </h2>

            <p>
                Customer conversations
            </p>

        </div>


        <div id="customerList">

            <div class="no-conversations">
                Loading...
            </div>

        </div>

    </aside>


    <!-- CHAT -->

    <main class="chat">


        <div class="chat-header">

            <h2 id="chatCustomerName">
                Select a customer
            </h2>

            <p id="chatCustomerInfo">
                Choose a conversation from the list.
            </p>

        </div>


        <div id="messages">

            <div class="empty">

                <h3>
                    No conversation selected
                </h3>

                <p>
                    Select a customer to view messages.
                </p>

            </div>

        </div>


        <div
            id="status"
            class="status">
        </div>


        <div class="input-area">

            <textarea
                id="messageInput"
                placeholder="Type your reply..."
                maxlength="2000"
                disabled>
            </textarea>

            <button
                id="sendBtn"
                disabled>
                Send
            </button>

        </div>

    </main>

</div>


<!-- =========================
     CUSTOMER CARE JAVASCRIPT
========================== -->

<script>

    const customerList =
        document.getElementById("customerList");

    const messagesBox =
        document.getElementById("messages");

    const chatCustomerName =
        document.getElementById("chatCustomerName");

    const chatCustomerInfo =
        document.getElementById("chatCustomerInfo");

    const messageInput =
        document.getElementById("messageInput");

    const sendBtn =
        document.getElementById("sendBtn");

    const statusBox =
        document.getElementById("status");

    const layout =
        document.getElementById("layout");


    let selectedCustomerId = null;

    let loading = false;


    /* =========================
       ESCAPE HTML
    ========================== */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;
    }


    /* =========================
       FORMAT TIME
    ========================== */

    function formatTime(dateString) {

        const date =
            new Date(dateString);

        if (isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleString([], {
            dateStyle: "short",
            timeStyle: "short"
        });
    }


    /* =========================
       LOAD CONVERSATIONS
    ========================== */

    async function loadConversations() {

        try {

            const response =
                await fetch(
                    "/api/admin/customer-care/conversations",
                    {
                        credentials: "include"
                    }
                );


            if (
                response.status === 401 ||
                response.status === 403
            ) {

                window.location.href =
                    "/admin/login.html";

                return;
            }


            const data =
                await response.json();


            if (!data.success) {

                customerList.innerHTML = `
                    <div class="no-conversations">
                        ${escapeHTML(
                            data.message ||
                            "Unable to load conversations."
                        )}
                    </div>
                `;

                return;
            }


            displayCustomers(
                data.customers || []
            );


        } catch (error) {

            console.error(
                "Load conversations error:",
                error
            );

            customerList.innerHTML = `
                <div class="no-conversations">
                    Unable to connect to server.
                </div>
            `;
        }
    }


    /* =========================
       DISPLAY CUSTOMERS
    ========================== */

    function displayCustomers(customers) {

        if (!customers.length) {

            customerList.innerHTML = `
                <div class="no-conversations">
                    No customer messages yet.
                </div>
            `;

            return;
        }


        customerList.innerHTML = "";


        customers.forEach(customer => {

            const item =
                document.createElement("div");

            item.className =
                "customer";


            if (
                Number(customer.id) ===
                Number(selectedCustomerId)
            ) {

                item.classList.add("active");
            }


            const unread =
                Number(
                    customer.unread_count || 0
                );


            item.innerHTML = `

                <div class="customer-name">
                    ${escapeHTML(
                        customer.name ||
                        "Customer"
                    )}
                </div>

                <div class="customer-email">
                    ${escapeHTML(
                        customer.email || ""
                    )}
                </div>

                <div class="customer-bottom">

                    <span class="last-message">

                        ${
                            customer.last_message_at
                            ? formatTime(
                                customer.last_message_at
                            )
                            : ""
                        }

                    </span>

                    ${
                        unread > 0
                        ? `
                            <span class="unread">
                                ${unread}
                            </span>
                        `
                        : ""
                    }

                </div>
            `;


            item.addEventListener(
                "click",
                () =>
                    openConversation(
                        customer.id
                    )
            );


            customerList.appendChild(item);

        });
    }


    /* =========================
       OPEN CONVERSATION
    ========================== */

    async function openConversation(customerId) {

        selectedCustomerId =
            customerId;


        layout.classList.add(
            "chat-open"
        );


        messagesBox.innerHTML = `

            <div class="empty">
                Loading messages...
            </div>

        `;


        messageInput.disabled = true;

        sendBtn.disabled = true;


        try {

            const response =
                await fetch(
                    `/api/admin/customer-care/messages/${customerId}`,
                    {
                        credentials: "include"
                    }
                );


            if (
                response.status === 401 ||
                response.status === 403
            ) {

                window.location.href =
                    "/admin/login.html";

                return;
            }


            const data =
                await response.json();


            if (!data.success) {

                messagesBox.innerHTML = `

                    <div class="empty">

                        ${escapeHTML(
                            data.message ||
                            "Unable to load conversation."
                        )}

                    </div>

                `;

                return;
            }


            chatCustomerName.textContent =
                data.customer.name ||
                "Customer";


            chatCustomerInfo.textContent =
                `${data.customer.email || ""} ${
                    data.customer.phone
                    ? " • " +
                      data.customer.phone
                    : ""
                }`;


            displayMessages(
                data.messages || []
            );


            messageInput.disabled =
                false;

            sendBtn.disabled =
                false;


            messageInput.focus();


            await markAsRead(
                customerId
            );


            await loadConversations();


        } catch (error) {

            console.error(
                "Open conversation error:",
                error
            );

            messagesBox.innerHTML = `

                <div class="empty">
                    Unable to load conversation.
                </div>

            `;
        }
    }


    /* =========================
       DISPLAY MESSAGES
    ========================== */

    function displayMessages(messages) {

        if (!messages.length) {

            messagesBox.innerHTML = `

                <div class="empty">
                    No messages.
                </div>

            `;

            return;
        }


        messagesBox.innerHTML = "";


        messages.forEach(message => {

            const wrapper =
                document.createElement("div");


            const isAdmin =
                message.sender_type ===
                "admin";


            wrapper.className =
                "message " +
                (
                    isAdmin
                    ? "admin"
                    : "customer"
                );


            const sender =
                isAdmin
                ? "You"
                : "Customer";


            wrapper.innerHTML = `

                <div class="bubble">

                    <div class="sender">
                        ${sender}
                    </div>

                    <div>
                        ${escapeHTML(
                            message.message
                        )}
                    </div>

                    <div class="time">
                        ${formatTime(
                            message.created_at
                        )}
                    </div>

                </div>

            `;


            messagesBox.appendChild(
                wrapper
            );

        });


        messagesBox.scrollTop =
            messagesBox.scrollHeight;
    }


    /* =========================
       MARK AS READ
    ========================== */

    async function markAsRead(customerId) {

        try {

            await fetch(
                `/api/admin/customer-care/read/${customerId}`,
                {
                    method: "PUT",
                    credentials: "include"
                }
            );

        } catch (error) {

            console.error(
                "Mark read error:",
                error
            );
        }
    }


    /* =========================
       SEND MESSAGE
    ========================== */

    async function sendMessage() {

        if (
            !selectedCustomerId ||
            loading
        ) {
            return;
        }


        const message =
            messageInput.value.trim();


        if (!message) {
            return;
        }


        loading = true;

        sendBtn.disabled = true;

        statusBox.textContent =
            "Sending...";


        try {

            const response =
                await fetch(
                    "/api/admin/customer-care/messages",
                    {
                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            customerId:
                                selectedCustomerId,

                            message:
                                message

                        })
                    }
                );


            if (
                response.status === 401 ||
                response.status === 403
            ) {

                window.location.href =
                    "/admin/login.html";

                return;
            }


            const data =
                await response.json();


            if (!data.success) {

                alert(
                    data.message ||
                    "Unable to send reply."
                );

                return;
            }


            messageInput.value = "";

            statusBox.textContent = "";


            await openConversation(
                selectedCustomerId
            );


        } catch (error) {

            console.error(
                "Send message error:",
                error
            );

            alert(
                "Unable to send reply. Please try again."
            );


        } finally {

            loading = false;

            sendBtn.disabled =
                !selectedCustomerId;
        }
    }


    /* =========================
       SEND BUTTON
    ========================== */

    sendBtn.addEventListener(
        "click",
        sendMessage
    );


    /* =========================
       ENTER TO SEND
    ========================== */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }

        }
    );


    /* =========================
       INITIAL LOAD
    ========================== */

    loadConversations();


    /* =========================
       AUTO REFRESH
    ========================== */

    setInterval(
        loadConversations,
        5000
    );

</script>


<!-- =========================
     SHARED NED HUB SIDEBAR
========================== -->

<script src="/admin/js/admin-sidebar.js"></script>
